<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modo Cocinero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F4EE;
    --surface:#FFFFFF;
    --surface-alt:#EFEAE0;
    --ink:#262220;
    --ink-muted:#726B60;
    --line:#E3DDCF;
    --primary:#2F6B4F;
    --primary-ink:#FFFFFF;
    --accent:#C24914;
    --accent-soft:#F5DCC9;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --scale:1;
    --shadow:0 10px 30px rgba(38,34,32,.10);
  }
  [data-theme="dark"]{
    --bg:#18160F;
    --surface:#221F19;
    --surface-alt:#2B2820;
    --ink:#F3EFE6;
    --ink-muted:#A79E8E;
    --line:#3A3529;
    --accent-soft:#402C1E;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  body.contrast{
    --ink-muted:var(--ink);
    --line:var(--ink);
  }
  body.contrast .btn-secondary, body.contrast .box, body.contrast .chip, body.contrast .cat-card{
    border-width:2px;
  }
  *{box-sizing:border-box;}
  html{ font-size:calc(16px * var(--scale)); }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
  body{
    margin:0;
    min-height:100dvh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    transition:background .25s ease, color .25s ease;
  }
  .app-shell{
    width:100%;
    min-height:100dvh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
  }
  .main-col{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    width:100%;
    order:0;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(18px + env(safe-area-inset-top)) 18px 12px;
    flex-shrink:0;
    position:sticky;
    top:0;
    background:var(--surface);
    z-index:5;
  }
  .topbar h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0;
    flex:1;
  }
  .iconbtn{
    width:38px;height:38px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-alt);
    border:1px solid var(--line);
    color:var(--ink);
    cursor:pointer;
    flex-shrink:0;
  }
  .iconbtn:hover{ background:var(--line); }
  .content{
    flex:1;
    width:100%;
    max-width:640px;
    padding:4px 18px 24px;
  }

  .tabbar{
    display:flex;
    border-top:1px solid var(--line);
    background:var(--surface);
    flex-shrink:0;
    padding:8px 6px calc(10px + env(safe-area-inset-bottom));
    position:sticky;
    bottom:0;
    z-index:5;
    order:1;
  }
  .tabbar.hide-mobile{ display:none; }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:6px 0;
    border-radius:12px;
    cursor:pointer;
    color:var(--ink-muted);
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
  }
  .tab.active{ color:var(--primary); }
  .tab span{ font-size:.68rem; font-weight:600; }
  .brand{ display:none; }

  /* ---- Desktop / wide web layout (mobile-first: base styles above are mobile) ---- */
  @media (min-width:900px){
    body{ display:flex; }
    .app-shell{ flex-direction:row; max-width:1240px; margin:0 auto; }
    .brand{
      display:flex; align-items:center; gap:10px;
      padding:26px 22px 22px; font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem;
    }
    .brand .dotmark{ width:11px;height:11px;border-radius:50%;background:var(--primary); }
    .tabbar{
      order:-1;
      flex-direction:column;
      width:240px;
      flex-shrink:0;
      border-top:none;
      border-right:1px solid var(--line);
      padding:0 14px 20px;
      position:sticky;
      top:0;
      height:100dvh;
      justify-content:flex-start;
      gap:4px;
    }
    .tabbar.hide-mobile{ display:flex; }
    .tab{
      flex-direction:row;
      justify-content:flex-start;
      gap:12px;
      padding:11px 14px;
      font-size:.88rem;
      font-weight:600;
    }
    .tab.active{ background:var(--surface-alt); }
    .tab span{ font-size:.88rem; }
    .topbar{ padding:26px 40px 14px; }
    .topbar h1{ font-size:1.5rem; }
    .content{ max-width:none; padding:4px 40px 48px; }
  }

  /* ---- typography helpers ---- */
  .eyebrow{ font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin:22px 0 10px; }
  .eyebrow:first-child{ margin-top:6px; }
  h2.title{ font-family:'Fraunces',serif; font-weight:600; font-size:1.4rem; margin:6px 0 4px; }
  p.lead{ color:var(--ink-muted); font-size:.9rem; margin:0 0 18px; }

  /* ---- search ---- */
  .search-field{
    display:flex; align-items:center; gap:10px;
    background:var(--surface-alt);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:12px 14px;
    margin-bottom:18px;
  }
  .search-field input{
    border:none; outline:none; background:none; flex:1;
    font-family:'Inter'; font-size:.92rem; color:var(--ink);
  }
  .search-field svg{ flex-shrink:0; color:var(--ink-muted); }

  .cards-grid{ display:flex; flex-direction:column; }
  .rows-list{ display:flex; flex-direction:column; }
  @media (min-width:700px){
    .cards-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
    .cards-grid .recipe-card{ margin-bottom:0; }
    .rows-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:4px 24px; }
    .cat-grid{ grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
  }

  .recipe-detail-grid{ display:flex; flex-direction:column; }
  @media (min-width:800px){
    .recipe-detail-grid{ display:grid; grid-template-columns:380px 1fr; gap:36px; align-items:start; }
    .recipe-detail-grid .thumb{ margin-bottom:0 !important; position:sticky; top:100px; }
    .cook-center{ max-width:520px; margin:0 auto; width:100%; }
  }

  /* ---- category chips / cards ---- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px; }
  .chip-row::-webkit-scrollbar{ height:0; }
  .chip{
    flex-shrink:0;
    display:flex; align-items:center; gap:7px;
    padding:9px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--surface);
    cursor:pointer;
    font-size:.82rem; font-weight:600;
    white-space:nowrap;
  }
  .chip .dot{ width:9px; height:9px; border-radius:50%; }
  .chip.active{ background:var(--ink); color:var(--surface); border-color:var(--ink); }

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .cat-card{
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:16px;
    cursor:pointer;
    display:flex; flex-direction:column; gap:20px;
    background:var(--surface);
  }
  .cat-card .dot{ width:14px; height:14px; border-radius:50%; }
  .cat-card b{ font-size:.9rem; }
  .cat-card small{ color:var(--ink-muted); font-size:.75rem; }

  /* ---- recipe thumbnail / hero ---- */
  .thumb{
    border-radius:var(--radius-md);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .thumb svg{ opacity:.9; }

  /* ---- recipe list item (search / explore results) ---- */
  .recipe-row{
    display:flex; gap:12px;
    padding:10px 0;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    align-items:center;
  }
  .recipe-row:last-child{ border-bottom:none; }
  .recipe-row .thumb{ width:64px; height:64px; }
  .recipe-row .info{ flex:1; min-width:0; }
  .recipe-row .info .name{ font-weight:600; font-size:.94rem; margin-bottom:4px; }
  .recipe-row .info .meta{ font-size:.76rem; color:var(--ink-muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .recipe-row .info .meta b{ color:var(--ink); }

  /* ---- recipe grid card (home recommendations) ---- */
  .recipe-card{
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    overflow:hidden;
    cursor:pointer;
    margin-bottom:14px;
    background:var(--surface);
  }
  .recipe-card .thumb{ width:100%; height:130px; border-radius:0; }
  .recipe-card .body{ padding:12px 14px 14px; }
  .recipe-card .name{ font-weight:600; font-size:.98rem; margin-bottom:6px; }
  .recipe-card .meta{ display:flex; gap:8px; flex-wrap:wrap; }

  .meta-chip{
    font-size:.72rem; font-weight:600;
    padding:3px 9px;
    border-radius:8px;
    background:var(--surface-alt);
    color:var(--ink-muted);
    border:1px solid var(--line);
  }

  /* ---- common-region boxes ---- */
  .box{
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:6px 16px;
    margin-bottom:18px;
    background:var(--surface);
  }
  .box-row{
    display:flex; align-items:center; gap:10px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    font-size:.88rem;
  }
  .box-row:last-child{ border-bottom:none; }
  .box-row .bullet{ width:6px;height:6px;border-radius:50%;background:var(--primary); flex-shrink:0; }

  .macro-grid{ display:grid; grid-template-columns:1fr 1fr; }
  .macro-cell{ padding:14px 0; text-align:center; border-bottom:1px solid var(--line); }
  .macro-cell:nth-child(odd){ border-right:1px solid var(--line); }
  .macro-cell:nth-last-child(-n+2){ border-bottom:none; }
  .macro-cell b{ display:block; font-family:'IBM Plex Mono',monospace; font-size:1.05rem; }
  .macro-cell span{ font-size:.7rem; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em; }

  /* ---- buttons ---- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    border-radius:var(--radius-md);
    font-family:'Inter'; font-weight:600; font-size:.92rem;
    padding:14px; cursor:pointer; border:none;
    width:100%;
  }
  .btn-primary{ background:var(--primary); color:var(--primary-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-secondary{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn-secondary:hover{ background:var(--surface-alt); }
  .btn-ghost{ background:none; color:var(--ink-muted); border:1px dashed var(--line); }
  .btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, input:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }

  /* ---- Modo Cocinero (cook screen) ---- */
  .cook-wrap{ display:flex; flex-direction:column; height:100%; }
  .dots{ display:flex; justify-content:center; gap:6px; margin:6px 0 18px; }
  .dot-step{ width:7px; height:7px; border-radius:50%; background:var(--line); transition:all .2s; }
  .dot-step.active{ width:20px; border-radius:4px; background:var(--primary); }
  .dot-step.done{ background:var(--primary); opacity:.4; }

  .cook-hero{ height:190px; border-radius:var(--radius-lg); display:flex; align-items:center; justify-content:center; margin-bottom:22px; }
  .cook-instruction{ font-family:'Fraunces',serif; font-size:1.35rem; font-weight:600; text-align:center; line-height:1.4; margin-bottom:22px; }

  .timer-box{
    border:1px solid var(--line);
    background:var(--surface-alt);
    border-radius:var(--radius-md);
    padding:16px;
    margin-bottom:22px;
    text-align:center;
  }
  .timer-value{ font-family:'IBM Plex Mono',monospace; font-size:2.1rem; font-weight:600; margin-bottom:10px; color:var(--accent); }
  .timer-actions{ display:flex; gap:8px; }
  .timer-actions button{ flex:1; }

  .mic-wrap{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:22px; }
  .mic-btn{
    width:64px; height:64px; border-radius:50%;
    background:var(--primary); color:var(--primary-ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; border:none; position:relative;
  }
  .mic-btn.listening{ background:var(--accent); }
  .mic-ring{
    position:absolute; inset:-8px; border-radius:50%;
    border:2px solid var(--accent); opacity:0; 
  }
  .mic-btn.listening .mic-ring{ animation:pulse 1.1s ease-out infinite; }
  @keyframes pulse{
    0%{ opacity:.65; transform:scale(.9); }
    100%{ opacity:0; transform:scale(1.35); }
  }
  .mic-caption{ font-size:.72rem; color:var(--ink-muted); text-align:center; }
  .wave{ display:flex; align-items:center; gap:2px; height:14px; }
  .wave i{ width:3px; background:currentColor; border-radius:2px; display:block; }

  .cook-controls{ display:flex; gap:8px; margin-top:auto; padding-top:6px; }
  .cook-controls .btn{ flex:1; }

  /* ---- toast ---- */
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px);
    background:var(--ink); color:var(--bg);
    padding:11px 18px; border-radius:24px; font-size:.82rem; font-weight:600;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:999;
    display:flex; align-items:center; gap:8px; max-width:90vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---- settings ---- */
  .setting-row{ display:flex; align-items:center; justify-content:between; gap:10px; padding:14px 0; border-bottom:1px solid var(--line); }
  .setting-row:last-child{ border-bottom:none; }
  .setting-row .label{ flex:1; }
  .setting-row .label b{ display:block; font-size:.9rem; margin-bottom:2px; }
  .setting-row .label small{ color:var(--ink-muted); font-size:.75rem; }

  .switch{ width:44px; height:26px; border-radius:14px; background:var(--line); position:relative; cursor:pointer; flex-shrink:0; border:none; }
  .switch.on{ background:var(--primary); }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .18s ease; }
  .switch.on::after{ transform:translateX(18px); }

  .segmented{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex-shrink:0; }
  .segmented button{ border:none; background:var(--surface); padding:7px 12px; font-size:.76rem; font-weight:600; color:var(--ink-muted); cursor:pointer; font-family:'Inter'; }
  .segmented button.active{ background:var(--ink); color:var(--surface); }

  .slider{ width:100%; accent-color:var(--primary); }

  .link-row{ display:flex; align-items:center; gap:12px; padding:15px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .link-row:last-child{ border-bottom:none; }
  .link-row .ic{ width:38px;height:38px;border-radius:10px; background:var(--surface-alt); display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .link-row .txt b{ display:block; font-size:.9rem; }
  .link-row .txt small{ color:var(--ink-muted); font-size:.75rem; }
  .link-row .chev{ margin-left:auto; color:var(--ink-muted); }

  /* ---- completed screen ---- */
  .celebrate{ text-align:center; padding:40px 6px 20px; }
  .celebrate .icon{ width:76px;height:76px;border-radius:50%; background:var(--primary); color:var(--primary-ink); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  .celebrate h2{ font-family:'Fraunces',serif; font-size:1.4rem; margin-bottom:6px; }
  .celebrate p{ color:var(--ink-muted); font-size:.88rem; margin-bottom:28px; }

  .empty-state{ text-align:center; padding:50px 10px; color:var(--ink-muted); }
  .empty-state svg{ margin-bottom:14px; opacity:.6; }
  .empty-state b{ display:block; color:var(--ink); margin-bottom:4px; }
</style>
</head>
<body>

<div class="app-shell" id="app"></div>
<div id="toast"></div>

<script>
/* ============================= DATA ============================= */
const CATEGORIES = [
  {id:'desayuno', name:'Desayuno', color:'#D98E04'},
  {id:'almuerzo', name:'Almuerzo', color:'#2F6B4F'},
  {id:'cena',     name:'Cena',     color:'#6B4226'},
  {id:'postre',   name:'Postre',   color:'#B5548C'},

];
const catColor = id => (CATEGORIES.find(c=>c.id===id)||{}).color || '#2F6B4F';

const RECIPES = [
  {id:'panqueques', name:'Panqueques clásicos', category:'desayuno', time:20, difficulty:'Fácil', servings:2,

      {text:'Tuesta las rebanadas de pan hasta que estén doradas.', seconds:120},

      {text:'Unta la palta sobre las tostadas y sirve.', seconds:0},

  {id:'cesar', name:'Ensalada César', category:'almuerzo', time:15, difficulty:'Fácil', servings:2,

  {id:'lomo', name:'Lomo saltado', category:'almuerzo', time:35, difficulty:'Media', servings:3,

    steps:[
      {text:'Corta la carne en tiras y sazona con sal y pimienta.', seconds:0},

  {id:'sopa', name:'Sopa de verduras', category:'cena', time:40, difficulty:'Fácil', servings:4,

    ingredients:['Zanahoria','Apio','Zapallo','Papa','Caldo de verduras'],
    steps:[

      {text:'Sazona y sirve caliente.', seconds:0},
    ]},
  {id:'pesto', name:'Pasta al pesto', category:'cena', time:25, difficulty:'Media', servings:2,
    macros:{kcal:410, prot:11, carbs:52, fat:16},

    steps:[
      {text:'Hierve agua con sal y cocina la pasta.', seconds:600},
      {text:'Licúa albahaca, piñones, ajo, aceite y parmesano.', seconds:0},
      {text:'Escurre la pasta y mezcla con el pesto.', seconds:0},
      {text:'Sirve con parmesano extra por encima.', seconds:0},
    ]},
  {id:'brownie', name:'Brownie de chocolate', category:'postre', time:45, difficulty:'Media', servings:8,
    macros:{kcal:350, prot:5, carbs:40, fat:19},
    ingredients:['200g chocolate','150g mantequilla','3 huevos','1 taza de azúcar','1 taza de harina'],
    steps:[
      {text:'Derrite el chocolate con la mantequilla a baño maría.', seconds:180},
      {text:'Bate los huevos con el azúcar hasta espumar.', seconds:0},
      {text:'Une ambas mezclas e incorpora la harina con movimientos suaves.', seconds:0},
      {text:'Vierte en un molde y hornea a 180°C.', seconds:1500},
      {text:'Deja enfriar antes de cortar en cuadros.', seconds:0},
    ]},

/* ============================= VOICE API ============================= */
/*
  Funcionalidad agregada sin librerías externas:
  - SpeechRecognition convierte la voz en texto.
  - SpeechSynthesisUtterance lee pasos, avisos y confirmaciones.
*/
const SpeechRecognitionAPI =
  window.SpeechRecognition || window.webkitSpeechRecognition;

const VOICE_LANGUAGE = 'es-BO';
let recognition = null;

function initSpeechRecognition(){
  if(!SpeechRecognitionAPI){
    state.voiceStatus =
      'El reconocimiento de voz no es compatible con este navegador';
    return;
  }

  recognition = new SpeechRecognitionAPI();
  recognition.lang = VOICE_LANGUAGE;
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    state.micListening = true;
    state.voiceStatus = 'Escuchando…';
    render();
  };

  recognition.onresult = event => {
    const result = event.results[event.results.length - 1][0];
    const transcript = result.transcript.trim();

    state.micListening = false;
    state.lastTranscript = transcript;
    state.voiceStatus = `Escuché: "${transcript}"`;
    render();

    executeVoiceCommand(transcript);
  };

  recognition.onerror = event => {
    state.micListening = false;

    const messages = {
      'not-allowed':'No se concedió permiso para usar el micrófono',
      'service-not-allowed':'El navegador bloqueó el reconocimiento de voz',
      'audio-capture':'No se encontró un micrófono disponible',
      'no-speech':'No escuché ninguna orden. Inténtalo nuevamente',
      'network':'No se pudo conectar con el servicio de reconocimiento',
      'aborted':'Escucha cancelada'
    };

    const message =
      messages[event.error] || `Error de voz: ${event.error}`;

    state.voiceStatus = message;
    toast(message);
    render();
  };

  recognition.onend = () => {
    if(state.micListening){
      state.micListening = false;
      state.voiceStatus = state.lastTranscript
        ? `Último comando: "${state.lastTranscript}"`
        : 'Toca el micrófono y di un comando';
      render();
    }
  };
}

/* ============================= HELPERS ============================= */
function fmtTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML = `🎙️ ${msg}`;
  t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
function goTo(screen, extra){
  stopTimer();
  stopVoiceRecognition(true);
  state.screen=screen;
  Object.assign(state, extra||{});
  render();
}

/* ============================= COOK FLOW ============================= */
function startCook(id){
  stopTimer();
  stopVoiceRecognition(true);

  state.screen='cook';
  state.recipeId=id;
  state.step=0;
  state.lastTranscript='';
  state.voiceStatus='Preparando el primer paso…';

  setupTimerForStep();
  render();

  /*
    Solo al comenzar la receta se lee automáticamente el primer paso.
    El usuario no necesita pedirlo por voz.
  */
  announceCurrentStep({
    prefix:'Primer paso.',
    includeInstruction:true
  });
}

function currentRecipe(){
  return RECIPES.find(r=>r.id===state.recipeId);
}

function currentStep(){
  const recipe=currentRecipe();
  return recipe?.steps?.[state.step] || null;
}

function currentStepText(){
  return currentStep()?.text || '';
}

function setupTimerForStep(){
  stopTimer();

  const seconds=currentStep()?.seconds || 0;

  state.timer={
    seconds,
    initialSeconds:seconds,
    running:false,
    started:false,
    completed:seconds<=0,
    intervalId:null
  };
}

function currentStepHasTimer(){
  return state.timer.initialSeconds>0;
}

function timerBlocksNextStep(){
  return currentStepHasTimer() && !state.timer.completed;
}

function timerWaitingMessage(){
  return (
    `Este paso necesita ${durationForSpeech(state.timer.initialSeconds)}. `+
    'Prepara primero la olla, el sartén, el horno o los utensilios. '+
    'Cuando todo esté listo, di iniciar temporizador.'
  );
}

function announceCurrentStep({
  prefix='',
  includeInstruction=false
}={}){
  const instruction=currentStepText();
  const parts=[];

  if(prefix) parts.push(prefix);
  if(includeInstruction && instruction) parts.push(instruction);

  if(currentStepHasTimer()){
    const waiting=timerWaitingMessage();
    parts.push(waiting);
    state.voiceStatus=waiting;
    toast('Temporizador listo. Esperando tu orden.');
  }else{
    state.voiceStatus='Toca el micrófono y di un comando';
  }

  render();

  const message=parts.join(' ').trim();
  if(message){
    setTimeout(()=>speakText(message),180);
  }
}

function stepNext(fromVoice=false){
  const recipe=currentRecipe();
  if(!recipe) return;

  /*
    Un paso con temporizador no se puede saltar:
    - antes de iniciar el conteo;
    - mientras está contando;
    - mientras está pausado.
  */
  if(timerBlocksNextStep()){
    let message;

    if(!state.timer.started){
      message=timerWaitingMessage();
    }else{
      message=(
        `Aún faltan ${durationForSpeech(state.timer.seconds)}. `+
        'Podrás avanzar cuando termine el temporizador.'
      );
    }

    state.voiceStatus=message;
    toast(message);
    render();
    speakText(message);
    return;
  }

  stopTimer();

  if(state.step>=recipe.steps.length-1){
    goTo('completed',{recipeId:recipe.id});
    speakText('Receta completada. Buen provecho.');
    return;
  }

  state.step++;
  setupTimerForStep();
  render();

  if(fromVoice){
    toast('Comando reconocido: "Siguiente paso"');
    announceCurrentStep({
      prefix:'Siguiente paso.',
      includeInstruction:true
    });
  }else{
    /*
      Si se utilizó el botón, no se lee automáticamente cada instrucción.
      Sin embargo, si el nuevo paso tiene temporizador, se avisa que debe
      prepararse todo antes de decir "iniciar temporizador".
    */
    announceCurrentStep({
      includeInstruction:false
    });
  }
}

function stepBack(fromVoice=false){
  if(state.step<=0){
    if(fromVoice){
      voiceFeedback('Ya estás en el primer paso.');
    }
    return;
  }

  stopTimer();
  state.step--;
  setupTimerForStep();
  render();

  if(fromVoice){
    toast('Comando reconocido: "Paso anterior"');
    announceCurrentStep({
      prefix:'Paso anterior.',
      includeInstruction:true
    });
  }else{
    announceCurrentStep({
      includeInstruction:false
    });
  }
}

function stepRepeat(){
  const instruction=currentStepText();
  if(!instruction) return;

  let message=instruction;

  if(currentStepHasTimer() && !state.timer.started){
    message+=` ${timerWaitingMessage()}`;
  }

  state.voiceStatus='Repitiendo la instrucción actual';
  toast('Repitiendo la instrucción actual');
  render();
  speakText(message);
}

function stopTimer(){
  if(state.timer.intervalId){
    clearInterval(state.timer.intervalId);
    state.timer.intervalId=null;
  }

  state.timer.running=false;
}

function inferTimerAction(){
  const text=normalizeVoiceText(currentStepText());

  const actions=[
    {terms:['hornea','hornear','horno'], label:'Iniciando el horneado'},
    {terms:['tuesta','tostar'], label:'Iniciando el tostado'},
    {terms:['sella','sellar'], label:'Iniciando el sellado'},
    {terms:['sofrie','sofreir','sofrito'], label:'Iniciando el sofrito'},
    {terms:['saltea','saltear'], label:'Iniciando el salteado'},
    {terms:['licua','licuar'], label:'Iniciando el licuado'},
    {terms:['derrite','derretir'], label:'Iniciando el derretido'},
    {terms:['calienta','calentar'], label:'Iniciando el calentamiento'},
    {terms:['hierve','hervir'], label:'Iniciando la cocción'},
    {terms:['cocina','cocinar','fuego'], label:'Iniciando la cocción'}
  ];

  const action=actions.find(item=>
    item.terms.some(term=>text.includes(term))
  );

  return action?.label || 'Temporizador iniciado';
}

function setCustomTimer(totalSeconds,fromVoice=false){
  stopTimer();

  const seconds=Math.max(1,Math.round(totalSeconds));

  state.timer={
    seconds,
    initialSeconds:seconds,
    running:false,
    started:false,
    completed:false,
    intervalId:null
  };

  render();
  startTimer(fromVoice);
}

function startTimer(fromVoice=false){
  if(!currentStepHasTimer() && state.timer.initialSeconds<=0){
    if(fromVoice){
      voiceFeedback(
        'Este paso no tiene un temporizador preparado. '+
        'Puedes decir temporizador de cinco minutos.'
      );
    }
    return;
  }

  if(state.timer.completed){
    if(fromVoice){
      voiceFeedback(
        'El temporizador ya terminó. Puedes decir siguiente paso.'
      );
    }
    return;
  }

  if(state.timer.running) return;

  state.timer.started=true;
  state.timer.running=true;
  render();

  const action=inferTimerAction();
  const message=(
    `${action}. Tiempo: ${durationForSpeech(state.timer.seconds)}.`
  );

  state.voiceStatus=message;
  toast(message);
  speakText(message);

  state.timer.intervalId=setInterval(()=>{
    state.timer.seconds--;

    if(state.timer.seconds<=0){
      state.timer.seconds=0;
      state.timer.completed=true;
      renderTimerOnly();
      stopTimer();

      const completedMessage=
        'Temporizador finalizado. Ya puedes decir siguiente paso.';

      state.voiceStatus=completedMessage;
      render();
      toast(completedMessage);
      speakText(completedMessage);
      return;
    }

    renderTimerOnly();
  },1000);
}

function pauseTimer(fromVoice=false){
  if(!state.timer.running){
    if(fromVoice){
      if(!state.timer.started){
        voiceFeedback(
          'El temporizador todavía no comenzó. '+
          'Cuando estés listo, di iniciar temporizador.'
        );
      }else{
        voiceFeedback('El temporizador ya está pausado.');
      }
    }
    return;
  }

  stopTimer();
  render();

  const message=(
    `Temporizador pausado. Faltan `+
    `${durationForSpeech(state.timer.seconds)}.`
  );

  if(fromVoice){
    voiceFeedback(message);
  }else{
    state.voiceStatus=message;
    toast(message);
  }
}

function cancelTimer(fromVoice=false){
  if(!currentStepHasTimer()) return;

  stopTimer();

  state.timer.seconds=state.timer.initialSeconds;
  state.timer.started=false;
  state.timer.completed=false;

  const message=(
    'Temporizador cancelado. Cuando vuelvas a estar listo, '+
    'di iniciar temporizador.'
  );

  state.voiceStatus=message;
  render();
  toast(message);

  if(fromVoice){
    speakText(message);
  }
}

function tellRemainingTime(){
  if(!currentStepHasTimer()){
    voiceFeedback('Este paso no tiene temporizador.');
    return;
  }

  if(state.timer.completed){
    voiceFeedback(
      'El temporizador terminó. Ya puedes decir siguiente paso.'
    );
    return;
  }

  if(!state.timer.started){
    voiceFeedback(
      `El temporizador todavía no comenzó. Está preparado para `+
      `${durationForSpeech(state.timer.initialSeconds)}.`
    );
    return;
  }

  voiceFeedback(`Faltan ${durationForSpeech(state.timer.seconds)}.`);
}

/* ---------- Lectura en voz alta ---------- */
function speechRate(){
  const values={lenta:0.82,normal:1,rapida:1.22};
  return values[state.settings.readSpeed] || 1;
}

function selectSpanishVoice(){
  if(!('speechSynthesis' in window)) return null;

  const voices=window.speechSynthesis.getVoices();

  return voices.find(v=>v.lang?.toLowerCase()==='es-bo')
    || voices.find(v=>v.lang?.toLowerCase().startsWith('es-'))
    || voices.find(v=>v.lang?.toLowerCase().startsWith('es'))
    || null;
}

function speakText(text){
  if(!text || !('speechSynthesis' in window)) return;

  window.speechSynthesis.cancel();

  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang=VOICE_LANGUAGE;
  utterance.rate=speechRate();
  utterance.pitch=1;
  utterance.volume=Math.min(
    1,
    Math.max(0,Number(state.settings.voiceVolume)/100)
  );

  const voice=selectSpanishVoice();
  if(voice) utterance.voice=voice;

  window.speechSynthesis.speak(utterance);
}

function voiceFeedback(message){
  state.voiceStatus=message;
  toast(message);
  render();

  if(state.settings.voiceConfirm){
    speakText(message);
  }
}

/* ---------- Reconocimiento de voz ---------- */
function toggleMic(){
  if(!state.settings.micEnabled){
    voiceFeedback('El micrófono está desactivado en Configuración.');
    return;
  }

  if(!recognition){
    voiceFeedback(
      'El reconocimiento de voz no está disponible en este navegador.'
    );
    return;
  }

  if(state.micListening){
    stopVoiceRecognition(false);
    state.voiceStatus='Escucha detenida';
    render();
    return;
  }

  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }

  state.lastTranscript='';
  state.voiceStatus='Preparando el micrófono…';
  render();

  try{
    recognition.start();
  }catch(error){
    state.micListening=false;
    state.voiceStatus=
      'El micrófono ya está iniciándose. Espera un momento.';
    toast(state.voiceStatus);
    render();
  }
}

function stopVoiceRecognition(abort=false){
  if(!recognition || !state.micListening) return;

  try{
    abort ? recognition.abort() : recognition.stop();
  }catch(error){
    // El reconocimiento ya había terminado.
  }

  state.micListening=false;
}

function normalizeVoiceText(text){
  return text
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\w\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function containsAny(text,options){
  return options.some(option=>text.includes(option));
}

function extractSpanishNumber(text){
  const digit=text.match(/\b(\d{1,3})\b/);
  if(digit) return Number(digit[1]);

  const direct={
    cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,
    seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,
    trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,
    dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,
    veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,
    veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,
    treinta:30,cuarenta:40,cincuenta:50,sesenta:60
  };

  const words=text.split(' ');

  for(let i=0;i<words.length;i++){
    const word=words[i];

    if(Object.prototype.hasOwnProperty.call(direct,word)){
      const base=direct[word];

      if([30,40,50,60].includes(base)){
        const next=words[i+1]==='y' ? words[i+2] : words[i+1];

        if(next && direct[next]>=1 && direct[next]<=9){
          return base+direct[next];
        }
      }

      return base;
    }
  }

  return null;
}

function timerDurationFromCommand(command){
  const amount=extractSpanishNumber(command);

  if(amount===null || amount<=0) return null;
  if(command.includes('segundo')) return amount;

  return amount*60;
}

function durationForSpeech(totalSeconds){
  const seconds=Math.max(0,Math.round(totalSeconds));
  const minutes=Math.floor(seconds/60);
  const rest=seconds%60;

  if(minutes>0 && rest>0){
    return `${minutes} ${minutes===1?'minuto':'minutos'} y `+
      `${rest} ${rest===1?'segundo':'segundos'}`;
  }

  if(minutes>0){
    return `${minutes} ${minutes===1?'minuto':'minutos'}`;
  }

  return `${rest} ${rest===1?'segundo':'segundos'}`;
}

function executeVoiceCommand(rawTranscript){
  const command=normalizeVoiceText(rawTranscript);

  if(containsAny(command,[
    'cuanto tiempo falta',
    'que tiempo falta',
    'tiempo restante'
  ])){
    tellRemainingTime();
    return;
  }

  if(containsAny(command,[
    'pausar temporizador',
    'pausa temporizador',
    'detener temporizador',
    'para el temporizador'
  ])){
    pauseTimer(true);
    return;
  }

  if(containsAny(command,[
    'cancelar temporizador',
    'cancela temporizador',
    'reiniciar temporizador'
  ])){
    cancelTimer(true);
    return;
  }

  if(containsAny(command,[
    'iniciar temporizador',
    'inicia temporizador',
    'iniciar tiempo',
    'inicia el tiempo',
    'comenzar temporizador',
    'comienza temporizador',
    'reanudar temporizador',
    'continua temporizador',
    'continuar temporizador',
    'pon un temporizador',
    'poner temporizador',
    'temporizador de'
  ])){
    const customSeconds=timerDurationFromCommand(command);

    if(customSeconds){
      setCustomTimer(customSeconds,true);
    }else{
      startTimer(true);
    }
    return;
  }

  if(containsAny(command,[
    'siguiente paso',
    'siguiente',
    'avanzar',
    'avanza',
    'continuar',
    'continua'
  ])){
    stepNext(true);
    return;
  }

  if(containsAny(command,[
    'paso anterior',
    'anterior',
    'volver',
    'vuelve',
    'atras',
    'retroceder'
  ])){
    stepBack(true);
    return;
  }

  if(containsAny(command,[
    'repetir instruccion',
    'repite la instruccion',
    'repetir paso',
    'repite el paso',
    'repetir',
    'repite'
  ])){
    stepRepeat();
    return;
  }

  if(containsAny(command,[
    'leer paso',
    'lee el paso',
    'leer instruccion',
    'lee la instruccion'
  ])){
    stepRepeat();
    return;
  }

  if(containsAny(command,[
    'ayuda',
    'que puedo decir',
    'comandos disponibles'
  ])){
    voiceFeedback(
      'Puedes decir: siguiente paso, paso anterior, repetir, '+
      'iniciar temporizador, pausar temporizador, cancelar temporizador '+
      'o cuánto tiempo falta.'
    );
    return;
  }

  voiceFeedback(
    `No entendí "${rawTranscript}". Prueba con: siguiente paso, `+
    'repetir, paso anterior o iniciar temporizador.'
  );
}

/* ============================= SETTINGS ============================= */
function toggleSetting(key){
  state.settings[key]=!state.settings[key];
  render();
}
function setSetting(key,val){
  state.settings[key]=val;
  if(key==='theme'){ document.body.setAttribute('data-theme', val); }
  if(key==='contrast'){ document.body.classList.toggle('contrast', val); }
  if(key==='textSize'){
    const scale = val==='small'?0.92:val==='large'?1.16:1;
    document.documentElement.style.setProperty('--scale', scale);
  }
  render();
}

/* ============================= RENDER ============================= */
function render(){
  const app=document.getElementById('app');
  let topbar='', content='', tabbar='';

  if(state.screen==='home') content=renderHome();
  else if(state.screen==='search') content=renderSearch();
  else if(state.screen==='explore') content=renderExplore();
  else if(state.screen==='recipe') content=renderRecipeDetail();
  else if(state.screen==='cook') content=renderCook();
  else if(state.screen==='completed') content=renderCompleted();
  else if(state.screen==='settings') content=renderSettings();
  else if(state.screen==='settings-voice') content=renderSettingsVoice();
  else if(state.screen==='settings-appearance') content=renderSettingsAppearance();
  else if(state.screen==='settings-help') content=renderSettingsHelp();

  const showTabbar = ['home','search','explore','settings'].includes(state.screen);
  const showBack = !showTabbar;

  topbar = `<div class="topbar">
    ${showBack ? `<button class="iconbtn" onclick="handleBack()" aria-label="Volver">${ic.back}</button>` : ''}
    <h1>${topbarTitle()}</h1>
    ${state.screen==='cook' ? `<button class="iconbtn" onclick="goTo('recipe',{recipeId:state.recipeId})" aria-label="Salir">✕</button>` : ''}
  </div>`;

  tabbar = `<div class="tabbar ${showTabbar?'':'hide-mobile'}">
    <div class="brand"><span class="dotmark"></span>Modo Cocinero</div>
    ${tabBtn('home', ic.home, 'Inicio')}
    ${tabBtn('search', ic.search, 'Buscar')}
    ${tabBtn('explore', ic.grid, 'Explorar')}
    ${tabBtn('settings', ic.settings, 'Ajustes')}
  </div>`;

  app.innerHTML = `${tabbar}<div class="main-col">${topbar}<div class="content" id="content">${content}</div></div>`;

  if(state.screen==='search'){
    const inp=document.getElementById('search-input');
    if(inp){ inp.focus(); const v=inp.value; inp.value=''; inp.value=v; }
  }
}
function tabBtn(scr, icon, label){
  return `<button class="tab ${state.screen===scr?'active':''}" onclick="goTo('${scr}')">${icon}<span>${label}</span></button>`;
}
function topbarTitle(){
  switch(state.screen){
    case 'home': return 'Modo Cocinero';
    case 'search': return 'Buscar receta';
    case 'explore': return state.category ? catName(state.category) : 'Explorar recetas';
    case 'recipe': return currentRecipe() ? currentRecipe().name : 'Receta';
    case 'cook': { const r=currentRecipe(); return r? `Paso ${state.step+1} de ${r.steps.length}` : 'Modo Cocinero'; }
    case 'completed': return '';
    case 'settings': return 'Configuración';
    case 'settings-voice': return 'Configuración de voz';
    case 'settings-appearance': return 'Apariencia';
    case 'settings-help': return 'Ayuda';
    default: return '';
  }
}
function handleBack(){
  if(state.screen==='recipe') goTo('explore', {category:state.category});
  else if(state.screen==='cook') goTo('recipe', {recipeId:state.recipeId});
  else if(state.screen==='completed') goTo('home');
  else if(['settings-voice','settings-appearance','settings-help'].includes(state.screen)) goTo('settings');
  else goTo('home');
}

/* ---- HOME ---- */
function renderHome(){
  const recommended = RECIPES.slice(0,3);
  return `
    <p class="lead" style="margin-top:2px;">Encuentra qué cocinar y sigue la receta paso a paso, con las manos libres.</p>

    <div class="search-field" onclick="goTo('search')" role="button" tabindex="0">
      ${ic.search}
      <input placeholder="Buscar receta o ingrediente..." readonly style="cursor:pointer;">
    </div>

    <div class="eyebrow">Categorías</div>
    <div class="chip-row">
      ${CATEGORIES.map(c=>`
        <div class="chip" onclick="selectCategory('${c.id}')">
          <span class="dot" style="background:${c.color}"></span>${c.name}
        </div>`).join('')}
    </div>

    <div class="eyebrow">Recomendadas para ti</div>
    <div class="cards-grid">${recommended.map(r=>recipeCard(r)).join('')}</div>
  `;
}

/* ---- SEARCH ---- */
function renderSearch(){
  const q=state.query.trim().toLowerCase();
  const results = q ? RECIPES.filter(r=>
    r.name.toLowerCase().includes(q) || r.ingredients.some(i=>i.toLowerCase().includes(q))
  ) : [];
  return `
    <div class="search-field">
      ${ic.search}
      <input id="search-input" placeholder="Buscar receta o ingrediente..." value="${state.query}" oninput="onSearchInput(this.value)">
    </div>
    ${!q ? `<div class="empty-state">${ic.empty}<b>Escribe para buscar</b>Prueba con el nombre de una receta o un ingrediente que tengas.</div>` :
      results.length ? `<div class="rows-list">${results.map(r=>recipeRow(r)).join('')}</div>` :
      `<div class="empty-state">${ic.empty}<b>No encontramos recetas</b>Prueba con otro nombre o ingrediente.</div>`}
  `;
}
function onSearchInput(v){ state.query=v; render(); }

/* ---- EXPLORE ---- */
function renderExplore(){
  if(!state.category){
    return `
      <p class="lead" style="margin-top:2px;">Elige una categoría para descubrir recetas.</p>
      <div class="cat-grid">
        ${CATEGORIES.map(c=>`
          <div class="cat-card" onclick="selectCategory('${c.id}')">
            <span class="dot" style="background:${c.color}"></span>
            <div><b>${c.name}</b><br><small>${RECIPES.filter(r=>r.category===c.id).length} recetas</small></div>
          </div>`).join('')}
      </div>`;
  }
  const list = RECIPES.filter(r=>r.category===state.category);
  return `
    <div class="chip-row">
      ${CATEGORIES.map(c=>`
        <div class="chip ${c.id===state.category?'active':''}" onclick="selectCategory('${c.id}')">
          <span class="dot" style="background:${c.color}"></span>${c.name}
        </div>`).join('')}
    </div>
    <div class="rows-list">${list.map(r=>recipeRow(r)).join('')}</div>
  `;
}

/* ---- shared recipe components ---- */

    <div class="thumb" style="background:linear-gradient(135deg, ${catColor(r.category)}, ${catColor(r.category)}cc);">${dishIcon('#fff',54)}</div>
    <div class="body">
      <div class="name">${r.name}</div>
      <div class="meta">
        <span class="meta-chip">${ic.clock} ${r.time} min</span>
        <span class="meta-chip">${r.difficulty}</span>
        <span class="meta-chip">${r.servings} porc.</span>
      </div>
    </div>
  </div>`;
}
function recipeRow(r){
  return `<div class="recipe-row" onclick="openRecipe('${r.id}')">
    <div class="thumb" style="background:linear-gradient(135deg, ${catColor(r.category)}, ${catColor(r.category)}cc);">${dishIcon('#fff',30)}</div>
    <div class="info">
      <div class="name">${r.name}</div>
      <div class="meta"><b>${r.time} min</b>· ${r.difficulty} · ${r.servings} porciones</div>
    </div>
  </div>`;
}

/* ---- RECIPE DETAIL ---- */
function renderRecipeDetail(){
  const r=currentRecipe(); if(!r) return '';
  return `
    <div class="recipe-detail-grid">
      <div class="thumb" style="width:100%;height:190px;border-radius:var(--radius-lg);margin-bottom:16px;background:linear-gradient(135deg, ${catColor(r.category)}, ${catColor(r.category)}cc);">${dishIcon('#fff',84)}</div>
      <div>
        <h2 class="title">${r.name}</h2>
        <div class="chip-row" style="margin-bottom:18px;">
          <span class="meta-chip">${ic.clock} ${r.time} min</span>
          <span class="meta-chip">${r.difficulty}</span>
          <span class="meta-chip">${r.servings} porciones</span>
        </div>

        <div class="eyebrow">Ingredientes</div>
        <div class="box">
          ${r.ingredients.map(i=>`<div class="box-row"><span class="bullet"></span>${i}</div>`).join('')}
        </div>

        <div class="eyebrow">Información nutricional</div>
        <div class="box" style="padding:0;">
          <div class="macro-grid">
            <div class="macro-cell"><b>${r.macros.kcal}</b><span>Kcal</span></div>
            <div class="macro-cell"><b>${r.macros.prot} g</b><span>Proteína</span></div>
            <div class="macro-cell"><b>${r.macros.carbs} g</b><span>Carbohidratos</span></div>
            <div class="macro-cell"><b>${r.macros.fat} g</b><span>Grasas</span></div>
          </div>
        </div>

        <button class="btn btn-primary" onclick="startCook('${r.id}')">Iniciar Modo Cocinero</button>
      </div>
    </div>
  `;
}

/* ---- COOK (Modo Cocinero) ---- */
function renderCook(){
  const r=currentRecipe(); if(!r) return '';
  const st=r.steps[state.step];
  const hasTimer = st.seconds>0;
  return `
    <div class="cook-wrap cook-center">
      <div class="dots">
        ${r.steps.map((_,i)=>`<div class="dot-step ${i===state.step?'active':i<state.step?'done':''}"></div>`).join('')}
      </div>

      <div class="cook-hero" style="background:linear-gradient(135deg, ${catColor(r.category)}, ${catColor(r.category)}cc);">${dishIcon('#fff',60)}</div>

      <div class="cook-instruction">${st.text}</div>

      ${hasTimer ? `
        <div class="timer-box" id="timer-box">
          <div class="timer-value" id="timer-value">${fmtTime(state.timer.seconds)}</div>
          <div class="timer-actions">
            <button class="btn btn-secondary" onclick="${state.timer.running?'pauseTimer()':'startTimer()'}">${state.timer.running?'Pausar':'Iniciar'}</button>
            <button class="btn btn-ghost" onclick="cancelTimer()">Cancelar</button>
          </div>
        </div>` : ''}

      <div class="mic-wrap">
        <button class="mic-btn ${state.micListening?'listening':''}" onclick="toggleMic()" aria-label="Activar comando de voz">
          <span class="mic-ring"></span>${ic.mic}
        </button>
        <div class="mic-caption">${state.micListening ? 'Escuchando…' : state.voiceStatus}</div>
      </div>

      <div class="cook-controls">
        <button class="btn btn-secondary" onclick="stepBack()" ${state.step===0?'disabled style="opacity:.45"':''}>Atrás</button>
        <button class="btn btn-secondary" onclick="stepRepeat()">Repetir</button>
        <button class="btn btn-primary" onclick="stepNext()">${state.step===r.steps.length-1?'Finalizar':'Siguiente'}</button>
      </div>
    </div>
  `;
}
function renderTimerOnly(){
  const el=document.getElementById('timer-value');
  if(el) el.textContent = fmtTime(state.timer.seconds);
}

/* ---- COMPLETED ---- */
function renderCompleted(){
  const r=currentRecipe();
  return `<div class="cook-center">
    <div class="celebrate">
      <div class="icon">${ic.check}</div>
      <h2>¡Receta completada!</h2>
      <p>Terminaste "${r? r.name:''}". Buen provecho 🍽️</p>
    </div>
    <button class="btn btn-primary" style="margin-bottom:10px;" onclick="startCook('${r?r.id:''}')">Volver a preparar</button>
    <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="goTo('explore',{category:r?r.category:null})">Elegir otra receta</button>
    <button class="btn btn-ghost" onclick="goTo('home')">Regresar a Inicio</button>
  </div>`;
}

}
